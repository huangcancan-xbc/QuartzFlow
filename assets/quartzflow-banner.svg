<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">QuartzFlow</title>
  <desc id="desc">QuartzFlow branding with a colorful Q inside a writing app window and a themed document preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23a9f2"/>
      <stop offset="0.34" stop-color="#27c93f"/>
      <stop offset="0.67" stop-color="#ffbd2e"/>
      <stop offset="1" stop-color="#ff5f56"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1440" height="480" rx="28" fill="url(#background)"/>
  <rect width="1440" height="480" rx="28" fill="url(#grid)"/>
  <path d="M0 372C242 286 368 446 622 352S1010 244 1440 328V480H0Z" fill="#23a9f2" opacity=".045"/>

  <g transform="translate(76 82)">
    <circle cx="132" cy="158" r="138" fill="#23a9f2" opacity=".16" filter="url(#glow)"/>
    <rect width="264" height="316" rx="56" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="35" y="34" width="194" height="248" rx="28" fill="#f8fafc"/>
    <circle cx="62" cy="61" r="6" fill="#ff5f56"/>
    <circle cx="82" cy="61" r="6" fill="#ffbd2e"/>
    <circle cx="102" cy="61" r="6" fill="#27c93f"/>
    <path d="M35 86H229" stroke="#d9e1ec" stroke-width="2"/>
    <circle cx="128" cy="163" r="55" fill="none" stroke="url(#spectrum)" stroke-width="22"/>
    <path d="m164 204 43 38" fill="none" stroke="url(#spectrum)" stroke-width="22" stroke-linecap="round"/>
    <path d="M70 254h58" stroke="#23a9f2" stroke-width="7" stroke-linecap="round"/>
    <path d="M140 254h24" stroke="#27c93f" stroke-width="7" stroke-linecap="round"/>
    <path d="M176 254h18" stroke="#ffbd2e" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(394 104)">
    <text x="0" y="82" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="82" font-weight="750" letter-spacing="-3">Quartz<tspan fill="#6bc9ff">Flow</tspan></text>
    <text x="4" y="130" fill="#b8c2d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="4">OBSIDIAN THEME · CONTENT IN MOTION</text>
    <rect x="4" y="176" width="108" height="34" rx="17" fill="#23a9f2" fill-opacity=".14" stroke="#23a9f2" stroke-opacity=".52"/>
    <text x="58" y="199" text-anchor="middle" fill="#8bd9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">LIGHT</text>
    <rect x="124" y="176" width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="176" y="199" text-anchor="middle" fill="#dce4f4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">DARK</text>
    <rect x="240" y="176" width="164" height="34" rx="17" fill="#ffbd2e" fill-opacity=".11" stroke="#ffbd2e" stroke-opacity=".44"/>
    <text x="322" y="199" text-anchor="middle" fill="#ffd36b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">LOCAL FONTS</text>
    <path d="M4 255H644" stroke="url(#spectrum)" stroke-width="5" stroke-linecap="round"/>
    <text x="4" y="300" fill="#eef3fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">清晰写作，柔和流动。</text>
  </g>

  <g transform="translate(1084 70) rotate(3 130 160)">
    <rect x="16" y="18" width="244" height="326" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/>
    <rect width="244" height="326" rx="24" fill="#f8fafc"/>
    <circle cx="30" cy="30" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="30" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="30" r="6" fill="#27c93f"/>
    <rect x="28" y="72" width="132" height="16" rx="8" fill="#111827"/>
    <rect x="28" y="98" width="184" height="5" rx="2.5" fill="#23a9f2"/>
    <rect x="28" y="134" width="184" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="28" y="158" width="142" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="28" y="198" width="188" height="72" rx="13" fill="#eef2f7" stroke="#d7dee9"/>
    <path d="M48 224h56M48 244h126" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 298h188" stroke="url(#spectrum)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <rect x="1" y="1" width="1438" height="478" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
</svg>
